<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI五金店 - 平台管理后台</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<style>
/* ===== Reset & Variables ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sw:250px;
  --pri:#6366f1;--pri-light:#818cf8;--pri-bg:#eef2ff;
  --ok:#10b981;--warn:#f59e0b;--err:#ef4444;--info:#3b82f6;
  --g50:#f8fafc;--g100:#f1f5f9;--g200:#e2e8f0;--g300:#cbd5e1;
  --g400:#94a3b8;--g500:#64748b;--g600:#475569;--g700:#334155;--g800:#1e293b;--g900:#0f172a;
  --r:10px;--r-sm:6px;
  --sh:0 1px 2px rgba(0,0,0,.05);--sh-md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --tr:all .2s cubic-bezier(.4,0,.2,1);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;background:var(--g50);color:var(--g800);display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ===== Sidebar ===== */
.sb{width:var(--sw);background:#fff;border-right:1px solid var(--g200);display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:50}
.sb-head{padding:20px 20px 16px;border-bottom:1px solid var(--g100)}
.sb-logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--g900)}
.sb-logo i{font-size:22px;color:var(--pri)}
.sb-ver{font-size:11px;color:var(--g400);margin-top:3px;padding-left:32px}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto}
.sb-sec{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--g400);padding:16px 12px 6px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:var(--g500);cursor:pointer;font-size:13px;font-weight:500;transition:var(--tr);user-select:none}
.sb-item:hover{background:var(--g50);color:var(--g700)}
.sb-item.on{background:var(--pri-bg);color:var(--pri);font-weight:600}
.sb-item i{font-size:17px;width:20px;text-align:center}
.sb-badge{margin-left:auto;font-size:10px;background:var(--err);color:#fff;padding:1px 7px;border-radius:10px;font-weight:600}
.sb-foot{padding:14px 16px;border-top:1px solid var(--g100);font-size:11px;color:var(--g400);line-height:1.6}
.sb-status{display:flex;align-items:center;gap:6px;margin-top:4px}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}

/* ===== Main ===== */
.mn{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{height:52px;background:#fff;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.top h2{font-size:16px;font-weight:700;color:var(--g900)}
.top-r{display:flex;align-items:center;gap:12px}
.top-clock{font-size:12px;color:var(--g400);font-variant-numeric:tabular-nums}
.top-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--g200);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--g400);transition:var(--tr);font-size:16px}
.top-btn:hover{border-color:var(--pri);color:var(--pri)}

.ct{flex:1;overflow-y:auto;padding:20px 24px}

/* ===== Pages ===== */
.pg{display:none}.pg.on{display:block}

/* ===== KPI Row ===== */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-c{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:18px 20px;position:relative}
.kpi-c::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.kpi-c.pri::after{background:var(--pri)}.kpi-c.ok::after{background:var(--ok)}.kpi-c.warn::after{background:var(--warn)}.kpi-c.info::after{background:var(--info)}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.kpi-l{font-size:12px;color:var(--g500);font-weight:500}
.kpi-i{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.kpi-i.pri{background:var(--pri-bg);color:var(--pri)}.kpi-i.ok{background:#d1fae5;color:var(--ok)}.kpi-i.warn{background:#fef3c7;color:var(--warn)}.kpi-i.info{background:#dbeafe;color:var(--info)}
.kpi-v{font-size:26px;font-weight:800;color:var(--g900);letter-spacing:-.5px}
.kpi-s{font-size:11px;color:var(--g400);margin-top:3px}

/* ===== Panel ===== */
.pn{background:#fff;border:1px solid var(--g200);border-radius:var(--r);margin-bottom:18px}
.pn-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--g100)}
.pn-t{font-size:14px;font-weight:700;color:var(--g900)}
.pn-b{padding:18px}
.pn-acts{display:flex;gap:6px}

/* ===== Table ===== */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:9px 14px;font-size:11px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--g200);background:var(--g50);white-space:nowrap}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--g100);color:var(--g700)}
tr:hover td{background:var(--g50)}
.bd{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;gap:4px;white-space:nowrap}
.bd-ok{background:#d1fae5;color:#065f46}.bd-err{background:#fee2e2;color:#991b1b}.bd-warn{background:#fef3c7;color:#92400e}.bd-info{background:#dbeafe;color:#1e40af}.bd-g{background:var(--g100);color:var(--g600)}

/* ===== Button ===== */
.bt{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:var(--tr)}
.bt-p{background:var(--pri);color:#fff}.bt-p:hover{background:#4f46e5}
.bt-o{background:#fff;color:var(--g700);border-color:var(--g300)}.bt-o:hover{border-color:var(--pri);color:var(--pri)}
.bt-d{background:var(--err);color:#fff}
.bt-s{padding:4px 10px;font-size:11px}

/* ===== Search ===== */
.sb{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--g200);border-radius:var(--r-sm);background:#fff;min-width:200px}
.sb i{color:var(--g400);font-size:15px}
.sb input{border:none;outline:none;font-size:12px;flex:1;background:transparent;color:var(--g800)}
.sb input::placeholder{color:var(--g400)}

/* ===== Bar chart ===== */
.bc{display:flex;align-items:flex-end;gap:8px;height:140px;padding:0}
.bi{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bv{font-size:10px;color:var(--g500);font-weight:600}
.br{width:100%;border-radius:4px 4px 0 0;background:var(--pri);min-height:2px;transition:height .4s}
.bl{font-size:10px;color:var(--g400);white-space:nowrap}

/* ===== Donut ===== */
.dn{display:flex;align-items:center;gap:28px}
.dn-l{display:flex;flex-direction:column;gap:10px}
.dn-i{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--g600)}
.dn-d{width:10px;height:10px;border-radius:50%}

/* ===== Log table ===== */
.lm{font-weight:700;font-size:11px}.lm.GET{color:var(--ok)}.lm.POST{color:var(--warn)}.lm.PUT{color:var(--info)}.lm.DELETE{color:var(--err)}
.ls{font-weight:700}.ls.s2{color:var(--ok)}.ls.s4{color:var(--warn)}.ls.s5{color:var(--err)}
.lb{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g400);font-size:11px}

/* ===== Plan cards ===== */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan{border:1px solid var(--g200);border-radius:var(--r);padding:20px;position:relative}
.plan.pop{border-color:var(--pri)}
.plan-tag{position:absolute;top:-10px;right:16px;background:var(--pri);color:#fff;font-size:10px;font-weight:700;padding:2px 10px;border-radius:10px}
.plan-nm{font-size:16px;font-weight:700;color:var(--g900);margin-bottom:4px}
.plan-pr{font-size:28px;font-weight:800;color:var(--g900)}.plan-pr span{font-size:13px;font-weight:400;color:var(--g400)}
.plan-fs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.plan-f{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g600)}
.plan-f i{color:var(--ok);font-size:14px}

/* ===== Empty ===== */
.em{text-align:center;padding:36px;color:var(--g400);font-size:13px}
.em i{font-size:36px;margin-bottom:6px;display:block;color:var(--g300)}

/* ===== Grids ===== */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:24px;width:480px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px}
.modal .fg{margin-bottom:12px}
.modal .fg label{display:block;font-size:12px;font-weight:600;color:var(--g500);margin-bottom:4px}
.modal .fg input,.modal .fg select{width:100%;padding:9px 12px;border:1px solid var(--g200);border-radius:var(--r-sm);font-size:13px;outline:none;transition:var(--tr)}
.modal .fg input:focus,.modal .fg select:focus{border-color:var(--pri)}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--g300);border-radius:3px}
@media(max-width:1200px){.kpi{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.plans{grid-template-columns:1fr}}
@media(max-width:768px){.sb{display:none}.mn{margin-left:0}.kpi{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ===== Sidebar ===== -->
<aside class="sb">
  <div class="sb-head">
    <div class="sb-logo"><i class="ri-store-3-line"></i>AI五金店平台</div>
    <div class="sb-ver">SaaS Platform Admin v1.0</div>
  </div>
  <nav class="sb-nav">
    <div class="sb-sec">概览</div>
    <div class="sb-item on" data-p="dashboard"><i class="ri-dashboard-3-line"></i>平台概览</div>
    <div class="sb-item" data-p="logs"><i class="ri-terminal-box-line"></i>请求日志</div>
    <div class="sb-sec">租户管理</div>
    <div class="sb-item" data-p="shops"><i class="ri-building-2-line"></i>店铺管理</div>
    <div class="sb-item" data-p="tenants"><i class="ri-group-line"></i>租户用户</div>
    <div class="sb-sec">商业化</div>
    <div class="sb-item" data-p="plans"><i class="ri-vip-crown-2-line"></i>订阅方案</div>
    <div class="sb-item" data-p="billing"><i class="ri-money-cny-circle-line"></i>账单营收</div>
    <div class="sb-sec">系统</div>
    <div class="sb-item" data-p="llm"><i class="ri-robot-line"></i>AI用量监控</div>
    <div class="sb-item" data-p="audit"><i class="ri-shield-check-line"></i>审计日志</div>
  </nav>
  <div class="sb-foot">
    <div class="sb-status"><div class="sb-dot"></div>所有服务正常运行</div>
  </div>
</aside>

<!-- ===== Main ===== -->
<div class="mn">
  <header class="top">
    <h2 id="pgTitle">平台概览</h2>
    <div class="top-r">
      <span class="top-clock" id="clk"></span>
      <button class="top-btn" onclick="refresh()" title="刷新"><i class="ri-refresh-line"></i></button>
      <button class="top-btn" onclick="window.open('http://'+location.hostname+':8081')" title="前台H5"><i class="ri-smartphone-line"></i></button>
    </div>
  </header>
  <div class="ct">

    <!-- ===== Dashboard ===== -->
    <div class="pg on" id="pg-dashboard">
      <div class="kpi" id="kpiRow"></div>
      <div class="g2">
        <div class="pn"><div class="pn-h"><span class="pn-t">近7天平台GMV</span></div><div class="pn-b"><div class="bc" id="gmvChart"></div></div></div>
        <div class="pn"><div class="pn-h"><span class="pn-t">店铺状态分布</span></div><div class="pn-b"><div class="dn" id="shopDonut"></div></div></div>
      </div>
      <div class="g2">
        <div class="pn"><div class="pn-h"><span class="pn-t">活跃店铺 TOP 5</span></div><div class="pn-b" id="activeShops"></div></div>
        <div class="pn"><div class="pn-h"><span class="pn-t">最近平台事件</span></div><div class="pn-b" id="recentPlatform"></div></div>
      </div>
    </div>

    <!-- ===== Shops ===== -->
    <div class="pg" id="pg-shops">
      <div class="pn">
        <div class="pn-h">
          <span class="pn-t">店铺管理</span>
          <div class="pn-acts">
            <div class="sb"><i class="ri-search-line"></i><input placeholder="搜索店铺名称..." oninput="filterShops(this.value)"></div>
            <button class="bt bt-p bt-s" onclick="showCreateShop()"><i class="ri-add-line"></i>新建店铺</button>
          </div>
        </div>
        <div class="pn-b" style="padding:0">
          <div class="tw"><table><thead><tr><th>店铺ID</th><th>店铺名称</th><th>所有者</th><th>订阅方案</th><th>商品数</th><th>用户数</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody id="shopsTbl"></tbody></table></div>
        </div>
      </div>
    </div>

    <!-- ===== Tenants ===== -->
    <div class="pg" id="pg-tenants">
      <div class="pn">
        <div class="pn-h">
          <span class="pn-t">租户用户</span>
          <div class="pn-acts"><div class="sb"><i class="ri-search-line"></i><input placeholder="搜索用户名/手机..." oninput="filterTenants(this.value)"></div></div>
        </div>
        <div class="pn-b" style="padding:0">
          <div class="tw"><table><thead><tr><th>用户ID</th><th>用户名</th><th>所属店铺</th><th>手机</th><th>邮箱</th><th>角色</th><th>状态</th><th>最后登录</th></tr></thead>
          <tbody id="tenantsTbl"></tbody></table></div>
        </div>
      </div>
    </div>

    <!-- ===== Plans ===== -->
    <div class="pg" id="pg-plans">
      <div class="pn"><div class="pn-h"><span class="pn-t">订阅方案管理</span></div><div class="pn-b">
        <div class="plans" id="plansGrid"></div>
      </div></div>
    </div>

    <!-- ===== Billing ===== -->
    <div class="pg" id="pg-billing">
      <div class="kpi" id="billingKpi"></div>
      <div class="pn"><div class="pn-h"><span class="pn-t">营收趋势</span></div><div class="pn-b"><div class="bc" id="billingChart"></div></div></div>
    </div>

    <!-- ===== LLM Token Usage ===== -->
    <div class="pg" id="pg-llm">
      <div class="kpi" id="llmKpi"></div>
      <div class="pn"><div class="pn-h"><span class="pn-t">Token使用量统计</span></div><div class="pn-b" style="padding:0">
        <div class="tw"><table><thead><tr><th>分类</th><th>调用次数</th><th>Token总量</th><th>平均延迟</th></tr></thead>
        <tbody id="llmTbl"></tbody></table></div>
      </div></div>
    </div>

    <!-- ===== Logs ===== -->
    <div class="pg" id="pg-logs">
      <div class="pn">
        <div class="pn-h">
          <span class="pn-t">实时请求日志</span>
          <div class="pn-acts">
            <button class="bt bt-o bt-s" onclick="clearLogs()"><i class="ri-delete-bin-line"></i>清空</button>
            <button class="bt bt-p bt-s" id="arBtn" onclick="toggleAR()"><i class="ri-pause-line"></i>自动刷新</button>
          </div>
        </div>
        <div class="pn-b" style="padding:0;max-height:calc(100vh - 180px);overflow-y:auto">
          <div class="tw"><table><thead><tr><th>时间</th><th>方法</th><th>路径</th><th>状态</th><th>耗时</th><th>请求体</th></tr></thead>
          <tbody id="logTbl"></tbody></table></div>
        </div>
      </div>
    </div>

    <!-- ===== Audit ===== -->
    <div class="pg" id="pg-audit">
      <div class="pn"><div class="pn-h"><span class="pn-t">审计日志</span></div><div class="pn-b" style="padding:0">
        <div class="tw"><table><thead><tr><th>时间</th><th>事件</th><th>店铺</th><th>实体</th><th>详情</th></tr></thead>
          <tbody id="auditTbl"></tbody></table></div>
      </div></div>
    </div>

  </div>
</div>

<!-- ===== Create Shop Modal ===== -->
<div class="modal-bg" id="shopModal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>新建店铺</h3>
    <div class="fg"><label>店铺名称</label><input id="newShopName" placeholder="如：张三五金店"></div>
    <div class="fg"><label>所有者姓名</label><input id="newShopOwner" placeholder="如：张三"></div>
    <div class="fg"><label>订阅方案</label>
      <select id="newShopPlan"><option value="free">免费版</option><option value="basic">基础版</option><option value="professional">专业版</option></select>
    </div>
    <div class="modal-acts">
      <button class="bt bt-o" onclick="closeModal()">取消</button>
      <button class="bt bt-p" onclick="createShop()">创建</button>
    </div>
  </div>
</div>

<script>
const A = '/api';
let ar = true, lt = null, allShops = [], allTenants = [];

// ========== Nav ==========
document.querySelectorAll('.sb-item[data-p]').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.sb-item').forEach(n => n.classList.remove('on'));
    el.classList.add('on');
    document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
    document.getElementById('pg-' + el.dataset.p).classList.add('on');
    document.getElementById('pgTitle').textContent = el.textContent.trim();
    load(el.dataset.p);
  });
});
function refresh() { const a = document.querySelector('.sb-item.on'); if (a) load(a.dataset.p); }
function load(p) { ({dashboard:loadDash,shops:loadShops,tenants:loadTenants,plans:loadPlans,billing:loadBilling,llm:loadLLM,logs:startLogs,audit:loadAudit})[p]?.(); }

// ========== Clock ==========
setInterval(() => {
  const d = new Date();
  document.getElementById('clk').textContent = d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);

// ========== Dashboard ==========
async function loadDash() {
  const [dash, rev, items, trans] = await Promise.all([
    pj('/v1/dashboard'), pj('/v1/revenue'), pj('/v1/items'), pj('/v1/transactions?limit=8'),
  ]);
  const d = dash.data||{}, r = rev.data||{}, its = items.data||[], t = trans.data||{}, s = t.today_stats||{};

  document.getElementById('kpiRow').innerHTML = [
    kpi('已注册店铺', '1', 'pri', 'ri-building-2-line', '活跃租户'),
    kpi('平台GMV(今日)', '¥'+fn(r.today_revenue||0), 'ok', 'ri-line-chart-line', '出库 '+fn(s.stock_out_count||0)+' 笔'),
    kpi('平台总商品', fn(d.total_items||0), 'warn', 'ri-archive-stack-line', '库存总值 ¥'+fn(d.total_value||0)),
    kpi('AI调用(今日)', fn(d.today_events||0)+' 次', 'info', 'ri-robot-line', '火山引擎 豆包'),
  ].join('');

  const daily = r.daily_revenue||[];
  const mx = Math.max(...daily.map(x=>x.revenue),1);
  document.getElementById('gmvChart').innerHTML = daily.map(x =>
    `<div class="bi"><div class="bv">${fn(x.revenue)}</div><div class="br" style="height:${Math.max(x.revenue/mx*100,2)}%"></div><div class="bl">${x.date.slice(5)}</div></div>`
  ).join('') || '<div class="em">暂无数据</div>';

  const norm = its.filter(x=>!x.is_low_stock).length, low = its.filter(x=>x.is_low_stock).length, tot = norm+low||1;
  document.getElementById('shopDonut').innerHTML = `<div class="dn">
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="50" fill="none" stroke="var(--g100)" stroke-width="16"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="var(--ok)" stroke-width="16" stroke-dasharray="${norm/tot*314} 314" stroke-linecap="round" transform="rotate(-90 60 60)"/>
      ${low?`<circle cx="60" cy="60" r="50" fill="none" stroke="var(--err)" stroke-width="16" stroke-dasharray="${low/tot*314} 314" stroke-linecap="round" transform="rotate(${norm/tot*360-90} 60 60)"/>`:''}
      <text x="60" y="56" text-anchor="middle" font-size="20" font-weight="800" fill="var(--g900)">${tot}</text>
      <text x="60" y="72" text-anchor="middle" font-size="10" fill="var(--g400)">总SKU</text>
    </svg>
    <div class="dn-l">
      <div class="dn-i"><div class="dn-d" style="background:var(--ok)"></div>正常 ${norm}</div>
      <div class="dn-i"><div class="dn-d" style="background:var(--err)"></div>预警 ${low}</div>
    </div></div>`;

  const evts = t.transactions||[];
  document.getElementById('recentPlatform').innerHTML = evts.length ? evts.slice(0,6).map(e => {
    const o = e.event_type==='stock_out';
    return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--g50)">
      <span class="bd ${o?'bd-err':'bd-ok'}" style="min-width:30px;justify-content:center">${o?'出':'入'}</span>
      <span style="flex:1">${e.item_name}</span>
      <span style="font-weight:600;color:${o?'var(--err)':'var(--ok)'}">${o?'-':'+'}${e.quantity}</span>
      <span style="color:var(--g400);font-size:11px">${(e.created_at||'').slice(5,16)}</span>
    </div>`;
  }).join('') : '<div class="em"><i class="ri-exchange-line"></i>暂无操作记录</div>';

  document.getElementById('activeShops').innerHTML = `<div style="display:flex;align-items:center;gap:12px;padding:8px 0">
    <div style="width:36px;height:36px;border-radius:8px;background:var(--pri-bg);display:flex;align-items:center;justify-content:center"><i class="ri-building-2-line" style="color:var(--pri)"></i></div>
    <div style="flex:1"><div style="font-size:14px;font-weight:600">五金店 Demo</div><div style="font-size:11px;color:var(--g400)">shop_hardware · 免费版</div></div>
    <span class="bd bd-ok">运行中</span>
  </div>`;
}

function kpi(l,v,c,i,s) { return `<div class="kpi-c ${c}"><div class="kpi-top"><span class="kpi-l">${l}</span><div class="kpi-i ${c}"><i class="${i}"></i></div></div><div class="kpi-v">${v}</div><div class="kpi-s">${s}</div></div>`; }

// ========== Shops ==========
async function loadShops() {
  // Currently single demo shop, show as management view
  const [dash, items] = await Promise.all([pj('/v1/dashboard'), pj('/v1/items')]);
  const d = dash.data||{}, its = items.data||[];
  allShops = [{
    shop_id: 'shop_hardware', name: '五金店 Demo', owner_name: '管理员',
    plan: 'free', item_count: its.length, user_count: 0, status: 'active', created_at: '2026-04-11',
  }];
  renderShops(allShops);
}
function renderShops(shops) {
  document.getElementById('shopsTbl').innerHTML = shops.map(s => `<tr>
    <td style="font-size:11px;color:var(--g400)">${s.shop_id}</td>
    <td style="font-weight:600">${s.name}</td>
    <td>${s.owner_name}</td>
    <td><span class="bd ${s.plan==='professional'?'bd-info':s.plan==='basic'?'bd-warn':'bd-g'}">${({free:'免费版',basic:'基础版',professional:'专业版'})[s.plan]||s.plan}</span></td>
    <td style="font-weight:600">${s.item_count}</td>
    <td>${s.user_count}</td>
    <td><span class="bd ${s.status==='active'?'bd-ok':'bd-err'}">${s.status==='active'?'运行中':'已停用'}</span></td>
    <td style="font-size:11px;color:var(--g400)">${s.created_at}</td>
    <td><button class="bt bt-o bt-s">编辑</button></td>
  </tr>`).join('') || '<tr><td colspan="9" class="em">暂无店铺</td></tr>';
}
function filterShops(q) { renderShops(allShops.filter(s => s.name.includes(q) || s.shop_id.includes(q))); }

function showCreateShop() { document.getElementById('shopModal').style.display = 'flex'; }
function closeModal() { document.getElementById('shopModal').style.display = 'none'; }
async function createShop() {
  const name = document.getElementById('newShopName').value;
  const owner = document.getElementById('newShopOwner').value;
  if (!name) return alert('请输入店铺名称');
  alert('店铺创建功能 - 需后端API支持\n\n名称: ' + name + '\n所有者: ' + owner);
  closeModal();
}

  renderTenants(allTenants);
}

function filterTenants(q) { renderTenants(allTenants.filter(u => (u.username||'').includes(q) || (u.phone||'').includes(q))); }

// ========== Billing ==========
async function loadBilling() {
  const rev = await pj('/v1/revenue');
  const r = rev.data||{};
  document.getElementById('billingKpi').innerHTML = [
    kpi('今日营收', '¥'+fn(r.today_revenue||0), 'ok', 'ri-money-cny-circle-line', '平台GMV'),
    kpi('本周营收', '¥'+fn(r.week_revenue||0), 'pri', 'ri-calendar-line', '7日累计'),
    kpi('本月营收', '¥'+fn(r.month_revenue||0), 'warn', 'ri-bar-chart-box-line', '当月累计'),
    kpi('订阅收入', '¥0', 'info', 'ri-vip-crown-2-line', '付费店铺 0 个'),
  ].join('');
  const daily = r.daily_revenue||[], mx = Math.max(...daily.map(x=>x.revenue),1);
  document.getElementById('billingChart').innerHTML = daily.map(x =>
    `<div class="bi"><div class="bv">${fn(x.revenue)}</div><div class="br" style="height:${Math.max(x.revenue/mx*100,2)}%"></div><div class="bl">${x.date.slice(5)}</div></div>`
  ).join('') || '<div class="em">暂无数据</div>';
}

// ========== LLM Token Usage ==========
async function loadLLM() {
  try {
    const res = await pj('/v1/token-usage?days=7');
    const d = res.data || {};
    const s = d.summary || {};
    const byModel = d.by_model || [];
    const byUser = d.by_user || [];
    const daily = d.daily || [];

    document.getElementById('llmKpi').innerHTML = [
      kpi('总Token消耗', fn(s.total_tokens || 0), 'pri', 'ri-coin-line', fn(s.call_count || 0) + ' 次调用'),
      kpi('Prompt Tokens', fn(s.total_prompt_tokens || 0), 'info', 'ri-input-field', '输入token'),
      kpi('Completion Tokens', fn(s.total_completion_tokens || 0), 'ok', 'ri-output-field', '输出token'),
      kpi('平均延迟', (s.avg_latency_ms || 0) + 'ms', 'warn', 'ri-timer-line', 'LLM推理耗时'),
    ].join('');

    // By model table
    let modelRows = byModel.map(m => `<tr>
      <td style="font-weight:600">${esc(m.model || '-')}</td>
      <td style="font-weight:600">${fn(m.calls)}</td>
      <td style="font-weight:700;color:var(--pri)">${fn(m.tokens)}</td>
      <td>${m.avg_latency_ms}ms</td>
    </tr>`).join('');

    // By user table
    let userRows = byUser.map(u => `<tr>
      <td style="font-size:11px;color:var(--g400)">${esc(u.user_id || '-')}</td>
      <td style="font-weight:600">${fn(u.calls)}</td>
      <td style="font-weight:700;color:var(--pri)">${fn(u.tokens)}</td>
      <td>${u.avg_latency_ms}ms</td>
    </tr>`).join('');

    // Daily chart
    const mx = Math.max(...daily.map(x => x.tokens), 1);
    const chartHtml = daily.length ? daily.map(x =>
      `<div class="bi"><div class="bv">${fn(x.tokens)}</div><div class="br" style="height:${Math.max(x.tokens/mx*100,2)}%"></div><div class="bl">${x.date.slice(5)}</div></div>`
    ).join('') : '<div class="em">暂无token消耗数据</div>';

    document.getElementById('llmTbl').innerHTML = `
      <tr><td colspan="4" style="padding:12px 0;font-weight:700;font-size:13px;color:var(--g900);border-bottom:2px solid var(--g200)">按模型统计</td></tr>
      <tr><th>模型</th><th>调用次数</th><th>Token总量</th><th>平均延迟</th></tr>
      ${modelRows || '<tr><td colspan="4" class="em">暂无数据</td></tr>'}
      <tr><td colspan="4" style="padding:16px 0 12px;font-weight:700;font-size:13px;color:var(--g900);border-bottom:2px solid var(--g200)">按用户统计</td></tr>
      <tr><th>用户ID</th><th>调用次数</th><th>Token总量</th><th>平均延迟</th></tr>
      ${userRows || '<tr><td colspan="4" class="em">暂无数据</td></tr>'}
      <tr><td colspan="4" style="padding:16px 0 12px;font-weight:700;font-size:13px;color:var(--g900);border-bottom:2px solid var(--g200)">每日趋势</td></tr>
      <tr><td colspan="4"><div class="bc" style="height:120px">${chartHtml}</div></td></tr>
    `;
  } catch(e) {
    document.getElementById('llmTbl').innerHTML = '<tr><td colspan="4" class="em">加载失败</td></tr>';
  }
}

// ========== Logs ==========
function startLogs() { if(lt) clearInterval(lt); fetchLogs(); if(ar) lt=setInterval(fetchLogs,1000); }
async function fetchLogs() {
  try {
    const logs = await fetch(A+'/logs?limit=100').then(r=>r.json());
    document.getElementById('logTbl').innerHTML = logs.map(l => {
      const sc = 's'+String(l.status)[0];
      return `<tr>
        <td style="font-variant-numeric:tabular-nums;color:var(--g400);font-size:11px">${esc(l.time)}</td>
        <td><span class="lm ${l.method}">${l.method}</span></td>
        <td style="font-size:12px">${esc(l.path)}${l.query?' <span style="color:var(--g400);font-size:10px">?'+esc(l.query)+'</span>':''}</td>
        <td><span class="ls ${sc}">${l.status}</span></td>
        <td style="font-variant-numeric:tabular-nums;color:var(--g500)">${l.duration_ms}ms</td>
        <td class="lb">${esc(l.body)}</td>
      </tr>`;
    }).join('');
  } catch(e) {}
}
function toggleAR() {
  ar = !ar;
  const b = document.getElementById('arBtn');
  if(ar){b.innerHTML='<i class="ri-pause-line"></i>自动刷新';startLogs();}
  else{b.innerHTML='<i class="ri-play-line"></i>已暂停';if(lt)clearInterval(lt);}
}
async function clearLogs() { await fetch(A+'/clear',{method:'POST'}); fetchLogs(); }

// ========== Audit ==========
async function loadAudit() {
  const res = await pj('/v1/audit-logs?limit=50');
  const logs = res.data||[];
  document.getElementById('auditTbl').innerHTML = logs.length ? logs.map(l => {
    let d=''; try{d=typeof l.details==='string'?l.details:JSON.stringify(l.details)}catch{d=l.details||''}
    return `<tr>
      <td style="font-size:11px;color:var(--g400)">${(l.created_at||'').slice(0,16)}</td>
      <td><span class="bd bd-info">${l.event_type}</span></td>
      <td style="font-size:11px">${l.entity_type||'-'}</td>
      <td style="font-size:10px;color:var(--g400)">${(l.entity_id||'').slice(0,12)}...</td>
      <td class="lb">${esc(d.slice(0,80))}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="5" class="em"><i class="ri-shield-check-line"></i>暂无审计记录</td></tr>';
}

// ========== Utils ==========
async function pj(p) { return fetch(A+p).then(r=>r.json()).catch(()=>({})); }
function fn(n) { n=Number(n)||0; if(n>=10000) return (n/10000).toFixed(1)+'w'; if(n>=1000) return (n/1000).toFixed(1)+'k'; return n===0?'0':n.toFixed(n%1===0?0:2); }
function esc(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

// ========== Init ==========
loadDash();
startLogs();
</script>
