services:
  ai-store-demo:
    build:
      context: .
      dockerfile: demo_app/Dockerfile
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - VOLCENGINE_API_KEY=5dda09ff-2b12-49d9-9528-c19fb769e483
      - VOLCENGINE_BASE_URL=https://ark.cn-beijing.volces.com/api/v3
      - VOLCENGINE_MODEL=ep-20260411121724-x22wn
      - DB_PATH=/data/store.db
    volumes:
      - store_data:/data
    restart: unless-stopped

volumes:
  store_data:
