<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>草图 - 登录页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        /* ===== 上方留白区域 ===== */
        .top-blank {
            flex: 1;
            min-height: 40vh;
        }

        /* ===== 功能区域容器 ===== */
        .action-area {
            padding: 0 24px 32px;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== 手机号区域 ===== */
        .phone-section {
            text-align: center;
            margin-bottom: 24px;
        }
        .phone-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .phone-number {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 1px;
        }
        .change-btn {
            font-size: 14px;
            color: #999;
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 3px 12px;
            background: #fff;
            cursor: pointer;
        }
        .carrier-text {
            font-size: 13px;
            color: #b0b0b0;
            margin-top: 8px;
        }

        /* ===== 按钮组 ===== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        /* 一键登录 - 蓝色主按钮 */
        .btn-primary {
            width: 100%;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            color: #fff;
            background: #4d6bfe;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }

        /* 微信登录 - 白色按钮 */
        .btn-white {
            width: 100%;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid #e5e5e5;
            border-radius: 24px;
            cursor: pointer;
            color: #1a1a1a;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-white:hover { background: #f9f9f9; }

        /* ===== 图标 ===== */
        .icon-phone {
            width: 20px; height: 20px;
        }
        .icon-wechat {
            width: 22px; height: 22px;
        }
        .icon-lock {
            width: 20px; height: 20px;
        }

        /* ===== 协议勾选 ===== */
        .agreement {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 6px;
            padding: 0 8px;
        }
        .checkbox {
            width: 16px;
            height: 16px;
            border: 1.5px solid #ccc;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 2px;
            cursor: pointer;
        }
        .agreement-text {
            font-size: 12px;
            color: #b0b0b0;
            line-height: 1.5;
        }
        .agreement-text a {
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- 上方留白 -->
    <div class="top-blank"></div>

    <!-- 功能区域 -->
    <div class="action-area">

        <!-- 手机号显示 -->
        <div class="phone-section">
            <div class="phone-row">
                <span class="phone-number">138****8888</span>
                <button class="change-btn">更换</button>
            </div>
            <div class="carrier-text">运营商认证服务</div>
        </div>

        <!-- 按钮组 -->
        <div class="btn-group">
            <!-- 手机号一键登录 -->
            <button class="btn-primary">
                <svg class="icon-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="5" y="2" width="14" height="20" rx="2"/>
                    <line x1="12" y1="18" x2="12" y2="18.01" stroke-width="3" stroke-linecap="round"/>
                </svg>
                手机号一键登录
            </button>

            <!-- 微信登录 -->
            <button class="btn-white">
                <svg class="icon-wechat" viewBox="0 0 24 24">
                    <circle cx="9" cy="12" r="1" fill="#07c160"/>
                    <circle cx="14" cy="10" r="1" fill="#07c160"/>
                    <path d="M9 3C5.1 3 2 5.7 2 9c0 1.8 1 3.4 2.5 4.5L4 16l2.8-1.4c.7.2 1.5.3 2.2.3.3 0 .6 0 .9-.1" fill="none" stroke="#07c160" stroke-width="1.5"/>
                    <path d="M15 8c-3.3 0-6 2.2-6 5s2.7 5 6 5c.7 0 1.4-.1 2-.3L20 19l-.8-2.5C20.4 15.3 21 13.7 21 12c0-2.8-2.7-5-6-5z" fill="none" stroke="#07c160" stroke-width="1.5"/>
                </svg>
                微信登录
            </button>

            <!-- 密码登录 -->
            <button class="btn-white">
                <svg class="icon-lock" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    <circle cx="12" cy="16" r="1" fill="#333"/>
                </svg>
                密码登录
            </button>
        </div>

        <!-- 协议 -->
        <div class="agreement">
            <div class="checkbox"></div>
            <div class="agreement-text">
                我已阅读并同意 <a href="#">用户协议</a> 与 <a href="#">隐私政策</a>
            </div>
        </div>

    </div>

</body>
</html>
