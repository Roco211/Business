<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI五金店大管家 - 登录草图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1a1a1a;
        }

        /* ===== 左上角 Logo ===== */
        .header {
            padding: 24px 32px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        /* ===== 主内容区 ===== */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 32px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }

        /* ===== 标题 ===== */
        .login-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .login-subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 36px;
        }

        /* ===== 表单 ===== */
        .form-group {
            margin-bottom: 16px;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
            color: #1a1a1a;
        }
        .form-input:focus {
            border-color: #1a1a1a;
        }
        .form-input::placeholder {
            color: #aaa;
        }

        /* 密码输入框带切换 */
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            padding: 4px;
        }

        /* ===== 验证码输入 ===== */
        .code-row {
            display: flex;
            gap: 10px;
        }
        .code-row .form-input {
            flex: 1;
        }
        .code-btn {
            padding: 14px 18px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            white-space: nowrap;
            color: #1a1a1a;
            transition: background 0.2s;
        }
        .code-btn:hover {
            background: #f5f5f5;
        }

        /* ===== 登录按钮 ===== */
        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .login-btn:hover {
            opacity: 0.9;
        }

        /* ===== 底部链接 ===== */
        .form-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            font-size: 14px;
        }
        .form-footer a {
            color: #4f46e5;
            text-decoration: none;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }

        /* ===== 底部文字 ===== */
        .bottom-text {
            margin-top: 32px;
            font-size: 13px;
            color: #999;
        }
        .bottom-text a {
            color: #666;
            text-decoration: none;
        }

        /* ===== 底部版权 ===== */
        .footer {
            text-align: center;
            padding: 20px 32px;
            font-size: 12px;
            color: #ccc;
        }
        .footer a {
            color: #aaa;
            text-decoration: none;
        }

        /* ===== 标签切换 ===== */
        .tab-row {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
            border-bottom: 1px solid #eee;
        }
        .tab-btn {
            padding: 10px 0;
            font-size: 15px;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            margin-right: 24px;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab-btn.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
        }

        /* ===== 验证码登录样式 ===== */
        .login-method-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
        }
        .method-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.2s, border-color 0.2s;
        }
        .method-tab.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
        }

        /* ===== Demo 标签 ===== */
        .demo-badge {
            display: inline-block;
            background: #f0f0ff;
            color: #4f46e5;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 左上角 Logo -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🏪</div>
            <span>AI五金店大管家</span>
        </div>
    </div>

    <!-- 主内容 -->
    <div class="main">
        <div class="login-card">
            <!-- 标题 -->
            <h1 class="login-title">开始使用</h1>
            <p class="login-subtitle">登录你的账户以继续 <span class="demo-badge">DEMO</span></p>

            <!-- 登录/注册标签 -->
            <div class="tab-row">
                <button class="tab-btn active">登录</button>
                <button class="tab-btn">注册</button>
            </div>

            <!-- 登录方式切换 -->
            <div class="login-method-tabs">
                <button class="method-tab active">密码登录</button>
                <button class="method-tab">验证码登录</button>
            </div>

            <!-- 表单 -->
            <form>
                <!-- 邮箱/手机号输入 -->
                <div class="form-group">
                    <input class="form-input" type="text" placeholder="邮箱 / 手机号 / 用户名" value="">
                </div>

                <!-- 密码输入 -->
                <div class="form-group">
                    <div class="password-wrapper">
                        <input class="form-input" type="password" placeholder="密码">
                        <button type="button" class="password-toggle">👁</button>
                    </div>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" class="login-btn" style="background: #1a1a1a; color: #fff;">
                    登录 →
                </button>

                <!-- 底部链接 -->
                <div class="form-footer">
                    <a href="#">忘记密码？</a>
                    <a href="#">没有账户？去注册</a>
                </div>

                <!-- 底部文字 -->
                <p class="bottom-text">
                    继续即表示你同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a>
                </p>
            </form>
        </div>
    </div>

    <!-- 底部版权 -->
    <div class="footer">
        © 2024 AI五金店大管家 · <a href="#">服务条款</a> · <a href="#">隐私政策</a> · <a href="#">文档</a>
    </div>

</body>
</html>
