services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

  migrator:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - ../../.env.example
    command: alembic -c /app/alembic.ini upgrade head
    depends_on:
      mysql:
        condition: service_started

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - ../../.env.example
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      migrator:
        condition: service_completed_successfully
      mysql:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - ../../.env.example
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      migrator:
        condition: service_completed_successfully
      mysql:
        condition: service_started
      redis:
        condition: service_started

  beat:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - ../../.env.example
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      migrator:
        condition: service_completed_successfully
      mysql:
        condition: service_started
      redis:
        condition: service_started
