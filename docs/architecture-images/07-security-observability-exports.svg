<text x="242" y="652" fill="#e2e8f0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15">  wnload</text>
<text x="242" y="674" fill="#e2e8f0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15">• 租户/门店隔离</text>
<text x="242" y="696" fill="#e2e8f0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15">• 导出动作审计</text>

