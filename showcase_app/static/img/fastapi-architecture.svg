  <text x="420" y="274" fill="#FFD8BE" font-family="Segoe UI, Arial" font-size="18">Session / TaskRun / Confirmation</text>
  <text x="420" y="306" fill="#FFD8BE" font-family="Segoe UI, Arial" font-size="18">InventoryEvent / AuditLog</text>
